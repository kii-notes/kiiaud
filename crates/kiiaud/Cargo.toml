[package]
name = "kiiaud"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "kiiaud"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kiiaud-core.workspace = true
kiiaud-playback.workspace = true
kiiaud-adapter-cli.workspace = true
kiiaud-adapter-mpd.workspace = true
kiiaud-adapter-jellyfin.workspace = true
kiiaud-adapter-lms.workspace = true
kiiaud-adapter-web.workspace = true
parking_lot.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
kiiaud-output-alsa.workspace = true

[target.'cfg(windows)'.dependencies]
kiiaud-output = { workspace = true }
kiiaud-output-asio = { workspace = true }
kiiaud-output-wasapi = { workspace = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
