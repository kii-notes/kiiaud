name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test-linux:
    name: Test & Lint (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace --verbose

  build-windows:
    name: Build & Artifact (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc --bin kiiaud --bin kiiaudctl

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: kiiaud-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/kiiaud.exe
            target/x86_64-pc-windows-msvc/release/kiiaudctl.exe

